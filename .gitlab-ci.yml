stages:
  - build
  - test

variables:
  DOCKER_IMAGE_NAME: magang-pusdatin:$CI_COMMIT_SHORT_SHA

build-image:
  stage: build
  tags:
    - magang-pusdatin
  script:
    - docker build -t $DOCKER_IMAGE_NAME .

test-laravel:
  stage: test
  tags:
    - magang-pusdatin
  script:
    - docker run --rm $DOCKER_IMAGE_NAME sh -c "cp .env.example .env && php artisan key:generate && php artisan test"
  after_script:
    - docker rmi $DOCKER_IMAGE_NAME 2>$null || true
