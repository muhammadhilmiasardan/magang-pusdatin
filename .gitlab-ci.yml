stages:
  - build
  - test

variables:
  DOCKER_IMAGE_NAME: magang-pusdatin:$CI_COMMIT_SHORT_SHA

build-image:
  stage: build
  tags:
    - magang-pusdatin
  script:
    - docker build -t $DOCKER_IMAGE_NAME .

test-laravel:
  stage: test
  tags:
    - magang-pusdatin
  script:
    - >
      docker run --rm
      -e APP_ENV=testing
      -e DB_CONNECTION=sqlite
      -e DB_DATABASE=":memory:"
      $DOCKER_IMAGE_NAME
      bash -c "composer install --no-interaction --quiet && cp .env.example .env && php artisan key:generate --quiet && php artisan test"
  after_script:
    - docker rmi $DOCKER_IMAGE_NAME
